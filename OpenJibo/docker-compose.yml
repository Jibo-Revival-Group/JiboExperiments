services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_LOCAL_WHISPER: ${OPENJIBO_ENABLE_LOCAL_WHISPER:-true}
        WHISPER_MODEL: ${OPENJIBO_WHISPER_MODEL:-base.en}
    image: openjibo-cloud:self-hosted
    env_file:
      - .env
    command:
      - /app/migrations/Jibo.Cloud.Migrations.dll
      - --apply
      - --target
      - all
    environment:
      OPENJIBO_POSTGRES_HOST: postgres
      OPENJIBO_POSTGRES_PORT: "5432"
      OPENJIBO_POSTGRES_USER: openjibo
      OPENJIBO_POSTGRES_PASSWORD: ${OPENJIBO_POSTGRES_PASSWORD}
      OPENJIBO_LEGACY_BACKUP_EXPORT_DIRECTORY: /data/legacy-backup-exports
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api-data:/data
    profiles:
      - self-hosted

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_LOCAL_WHISPER: ${OPENJIBO_ENABLE_LOCAL_WHISPER:-true}
        WHISPER_MODEL: ${OPENJIBO_WHISPER_MODEL:-base.en}
    image: openjibo-cloud:self-hosted
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      OpenJibo__State__Backend: PostgreSql
      OpenJibo__Deployment__Mode: self-hosted-isolated
      OPENJIBO_POSTGRES_HOST: postgres
      OPENJIBO_POSTGRES_PORT: "5432"
      OPENJIBO_POSTGRES_USER: openjibo
      OPENJIBO_POSTGRES_PASSWORD: ${OPENJIBO_POSTGRES_PASSWORD}
      OpenJibo__PersonalMemory__Backend: PostgreSql
      OpenJibo__Media__Backend: File
      OpenJibo__Stt__EnableLocalWhisperCpp: ${OPENJIBO_ENABLE_LOCAL_WHISPER:-true}
      OPENJIBO_STT_WHISPER_CLI_PATH: /usr/bin/whisper.cpp/build/bin/whisper-cli
      OPENJIBO_STT_WHISPER_MODEL_PATH: /usr/bin/whisper.cpp/models/ggml-${OPENJIBO_WHISPER_MODEL:-base.en}.bin
      OpenJibo__State__PersistencePath: /data/state/cloud-state.json
      OpenJibo__PersonalMemory__PersistencePath: /data/personal-memory/personal-memory.json
      OpenJibo__Media__DirectoryPath: /data/media
      OpenJibo__OwnerFirstName: Jibo
      OpenJibo__OwnerLastName: Owner
      OpenJibo__AcceptedHosts__0: localhost
      OpenJibo__AcceptedHosts__1: 127.0.0.1
      OpenJibo__AcceptedHosts__2: api.jibo.com
      OpenJibo__ReleaseSmoke__Enabled: ${OPENJIBO_RELEASE_SMOKE_ENABLED:-false}
      OpenJibo__ReleaseSmoke__Secret: ${OPENJIBO_RELEASE_SMOKE_SECRET:-}
      OpenJibo__ReleaseSmoke__MaxConcurrentDevices: ${OPENJIBO_RELEASE_SMOKE_MAX_CONCURRENT:-6}
      OpenJibo__SelfHosted__AllowTokenlessSingleRobotHub: ${OPENJIBO_ALLOW_TOKENLESS_SINGLE_ROBOT_HUB:-false}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - api-data:/data
    profiles:
      - self-hosted

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openjibo
      POSTGRES_PASSWORD: ${OPENJIBO_POSTGRES_PASSWORD}
      POSTGRES_DB: openjibo_state
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/cloud/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openjibo -d openjibo_state"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles:
      - self-hosted

  smoke:
    image: curlimages/curl:8.10.1
    depends_on:
      api:
        condition: service_started
    command:
      - sh
      - -c
      - >
        until curl -fsS http://api:8080/health;
        do
          echo waiting for Open Jibo;
          sleep 2;
        done
    profiles:
      - smoke

volumes:
  api-data:
  postgres-data:
