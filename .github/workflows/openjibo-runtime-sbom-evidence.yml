name: openjibo-runtime-sbom-evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: github.repository == 'transcendentsoftware-jd/JiboExperiments' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: openjibo-runtime-release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        cpu_profile: [portable, avx2]
    steps:
      - uses: actions/checkout@v7
      - name: Select reviewed immutable preview
        id: image
        env:
          PROFILE: ${{ matrix.cpu_profile }}
        run: |
          reference=$(python3 -B - "$PROFILE" <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('policy', 'OpenJibo/scripts/cloud/review-runtime-sbom.py')
          policy = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(policy)
          print(policy.IMAGE + '@' + policy.DIGESTS[sys.argv[1]])
          PY
          )
          printf 'reference=%s\n' "$reference" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "${reference#*@}" >> "$GITHUB_OUTPUT"
          mkdir evidence
          printf '%s\n' "$reference" > evidence/runtime-image.txt
      - name: Download pinned inventory scanner
        id: syft
        uses: anchore/sbom-action/download-syft@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3, Node 24
        with:
          syft-version: v1.54.1
      - name: Scan registry bytes without executing the image
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          IMAGE: ${{ steps.image.outputs.reference }}
          SYFT_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          "$SYFT" scan "registry:$IMAGE" --scope squashed \
            -o syft-json=evidence/runtime.syft.json \
            -o spdx-json=evidence/runtime.spdx.json
      - name: Bind inventory and report license-review gaps
        env:
          PROFILE: ${{ matrix.cpu_profile }}
        run: |
          python3 -B OpenJibo/scripts/cloud/review-runtime-sbom.py \
            --inventory evidence/runtime.syft.json --cpu-profile "$PROFILE" \
            > evidence/review.json
          jq -e '.spdxVersion == "SPDX-2.3" and .SPDXID == "SPDXRef-DOCUMENT"' \
            evidence/runtime.spdx.json >/dev/null
          sha256sum evidence/runtime.syft.json evidence/runtime.spdx.json evidence/review.json \
            > evidence/SHA256SUMS
      - name: Attest inventory for the existing image digest
        id: attestation
        uses: actions/attest@v4.2.2
        with:
          subject-name: ghcr.io/transcendent-software-llc/openjibo-runtime
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: evidence/runtime.spdx.json
          push-to-registry: false
      - name: Verify and retain signed inventory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          IMAGE: ${{ steps.image.outputs.reference }}
          BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          test -s "$BUNDLE"
          cp "$BUNDLE" evidence/sbom-attestation.json
          gh attestation verify "oci://$IMAGE" \
            --repo transcendentsoftware-jd/JiboExperiments \
            --signer-workflow transcendentsoftware-jd/JiboExperiments/.github/workflows/openjibo-runtime-sbom-evidence.yml \
            --source-digest "$GITHUB_SHA" --deny-self-hosted-runners \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --bundle evidence/sbom-attestation.json --format json \
            > evidence/attestation-verification.json
          jq -e 'type == "array" and length > 0 and all(.[]; .verificationResult != null)' \
            evidence/attestation-verification.json >/dev/null
          sha256sum evidence/sbom-attestation.json evidence/attestation-verification.json \
            >> evidence/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-sbom-${{ matrix.cpu_profile }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
