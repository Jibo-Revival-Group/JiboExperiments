<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Robot Debugger</title>
  <link rel="stylesheet" href="/portal/portal.css">
  <link rel="stylesheet" href="/portal/lrd/lrd.css">
</head>
<body>
  <div id="app">
    <div class="lrd-layout">
      <div class="lrd-toolbar">
        <div class="toolbar-content">
          <!-- Top toolbar - empty for now -->
        </div>
      </div>

      <div class="lrd-center">
        <!-- Center area - unpopulated for now -->
      </div>

      <div class="lrd-statusbar">
        <div class="statusbar-left">
          <div class="status-indicator" id="robotConnection">
            <span class="indicator-label">Robot:</span>
            <span class="indicator-value" id="robotConnectionStatus">Loading...</span>
          </div>
          <div class="status-indicator">
            <span class="indicator-label">Robot:</span>
            <select id="robotSelect" class="status-select">
              <option value="">Loading robots...</option>
            </select>
          </div>
        </div>
        <div class="statusbar-right">
          <div class="status-indicator">
            <span class="indicator-label">Ping:</span>
            <span class="indicator-value" id="serverPing">-- ms</span>
          </div>
          <div class="status-indicator">
            <span class="indicator-label">Server:</span>
            <span class="indicator-value" id="serverConnectionStatus">Loading...</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/portal/lrd/lrd.js"></script>
</body>
</html>
