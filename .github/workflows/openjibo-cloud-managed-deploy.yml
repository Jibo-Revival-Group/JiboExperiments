name: openjibo-cloud-managed-deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Managed image tag to deploy
        required: false
        default: managed
      location:
        description: Optional Azure region override for the Container Apps stack (for example eastus2)
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: openjibo-managed
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: OpenJibo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate managed deployment contract
        shell: bash
        run: bash ./OpenJibo/scripts/cloud/test-openjibo-managed-deployment-contract.sh

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy managed foundation
        id: foundation
        shell: bash
        run: |
          deployment_output="$(mktemp)"
          extract_outputs="$(mktemp)"
          bash ./scripts/cloud/deploy-openjibo-managed-foundation.sh \
            --resource-group-name "$OPENJIBO_RESOURCE_GROUP" \
            --open-weather-api-key "$OPENWEATHER_API_KEY" \
            --news-api-key "$NEWSAPI_KEY" | tee "$deployment_output"

          cat > "$extract_outputs" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as deployment_file:
              deployment = json.load(deployment_file)

          outputs = deployment["properties"]["outputs"]
          with open(sys.argv[2], "a", encoding="utf-8") as github_output:
              for output_name in ("keyVaultName", "registryName", "registryLoginServer"):
                  print(f"{output_name}={outputs[output_name]['value']}", file=github_output)
          PY
          python3 "$extract_outputs" "$deployment_output" "$GITHUB_OUTPUT"
        env:
          OPENJIBO_RESOURCE_GROUP: ${{ secrets.OPENJIBO_RESOURCE_GROUP }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}

      - name: Build and push managed image
        shell: bash
        run: bash ./scripts/cloud/publish-openjibo-managed.sh --registry-name "${{ steps.foundation.outputs.registryName }}" --tag "${{ inputs.image_tag }}"

      - name: Deploy managed Container Apps stack
        shell: bash
        run: >
          bash ./OpenJibo/scripts/cloud/deploy-openjibo-managed.sh
          --resource-group-name "$OPENJIBO_RESOURCE_GROUP"
          --key-vault-name "${{ steps.foundation.outputs.keyVaultName }}"
          --registry-name "${{ steps.foundation.outputs.registryName }}"
          --image-tag "${{ inputs.image_tag }}"
          ${{ inputs.location != '' && format('--location {0}', inputs.location) || '' }}
          --run-smoke
        env:
          OPENJIBO_RESOURCE_GROUP: ${{ secrets.OPENJIBO_RESOURCE_GROUP }}
