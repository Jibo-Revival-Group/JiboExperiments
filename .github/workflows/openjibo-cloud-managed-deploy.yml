name: openjibo-cloud-managed-deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Managed image tag to deploy
        required: false
        default: managed

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: openjibo-managed
    defaults:
      run:
        working-directory: OpenJibo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate managed deployment contract
        shell: bash
        run: bash ./scripts/cloud/test-openjibo-managed-deployment-contract.sh

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy managed foundation
        shell: bash
        run: >
          bash ./scripts/cloud/deploy-openjibo-managed-foundation.sh
          --resource-group-name "$OPENJIBO_RESOURCE_GROUP"
          --state-connection-string "$OPENJIBO_STATE_CONNECTION_STRING"
          --personal-memory-connection-string "$OPENJIBO_PERSONAL_MEMORY_CONNECTION_STRING"
          --open-weather-api-key "$OPENWEATHER_API_KEY"
          --news-api-key "$NEWSAPI_KEY"
        env:
          OPENJIBO_RESOURCE_GROUP: ${{ secrets.OPENJIBO_RESOURCE_GROUP }}
          OPENJIBO_STATE_CONNECTION_STRING: ${{ secrets.OPENJIBO_STATE_CONNECTION_STRING }}
          OPENJIBO_PERSONAL_MEMORY_CONNECTION_STRING: ${{ secrets.OPENJIBO_PERSONAL_MEMORY_CONNECTION_STRING }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}

      - name: Build and push managed image
        shell: bash
        run: bash ./scripts/cloud/publish-openjibo-managed.sh --registry-name "$OPENJIBO_ACR_NAME" --tag "${{ inputs.image_tag }}"
        env:
          OPENJIBO_ACR_NAME: openjiboacr

      - name: Deploy managed Container Apps stack
        shell: bash
        run: >
          bash ./scripts/cloud/deploy-openjibo-managed.sh
          --resource-group-name "$OPENJIBO_RESOURCE_GROUP"
          --key-vault-name "$OPENJIBO_KEY_VAULT_NAME"
          --registry-name "$OPENJIBO_ACR_NAME"
          --image-tag "${{ inputs.image_tag }}"
          --run-migration
          --run-smoke
        env:
          OPENJIBO_RESOURCE_GROUP: ${{ secrets.OPENJIBO_RESOURCE_GROUP }}
          OPENJIBO_KEY_VAULT_NAME: openjibokv
          OPENJIBO_ACR_NAME: openjiboacr
